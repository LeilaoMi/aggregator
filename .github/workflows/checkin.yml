name: Checkin
on:
  # custom: schedule disabled, checkin has no valid domain configured
  workflow_dispatch:

# custom: least-privilege GITHUB_TOKEN (scripts only read the repo; output goes out via PUSH_TOKEN / GIST_PAT)
permissions:
  contents: read


jobs:
  sync_with_upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Auto Checkin for Traffic

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          architecture: "x64"

      - name: Run Checkin Script
        run: |
          python ./.github/actions/checkin/universal.py || echo "Checkin script failed"

      - name: Record Timestamp
        run: date "+%Y-%m-%d %H:%M:%S"
