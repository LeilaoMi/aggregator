name: Process
on:
  schedule:
    - cron: "05 03 * * *"
    - cron: "05 11 * * *"
  workflow_dispatch:

env:
  # time zone
  TZ: Asia/Shanghai

  # network proxy aggregate config
  SUBSCRIBE_CONF: ${{ secrets.SUBSCRIBE_CONF }}

  # token
  PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}

  # not check connective
  SKIP_ALIVE_CHECK: ${{ vars.SKIP_ALIVE_CHECK }}

  # skip remark
  SKIP_REMARK: ${{ vars.SKIP_REMARK }}

  # workflow mode
  WORKFLOW_MODE: ${{ vars.WORKFLOW_MODE }}

  # include spwcial protocols, such vless hysteria2 and hysteria
  ENABLE_SPECIAL_PROTOCOLS: ${{ vars.ENABLE_SPECIAL_PROTOCOLS }}

  # custom: only harvest forks pushed within N days (0 = off)
  GITFORK_MAX_AGE_DAYS: ${{ vars.GITFORK_MAX_AGE_DAYS || '3' }}

  # custom: keep at most N nodes per server after alive check (0 = off)
  MAX_PER_SERVER: ${{ vars.MAX_PER_SERVER || '5' }}

  # custom: drop nodes whose server matches this regex
  EXCLUDE_SERVERS: ${{ vars.EXCLUDE_SERVERS }}

  # custom: fail the run (red) when 0 nodes survive or a push fails; set var to false to disable
  FAIL_ON_ERROR: ${{ vars.FAIL_ON_ERROR || 'true' }}

# custom: least-privilege GITHUB_TOKEN (scripts only read the repo; output goes out via PUSH_TOKEN / GIST_PAT)
permissions:
  contents: read


jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Prepare
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          architecture: "x64"
          cache: "pip"

      - name: Install
        run: pip3 install -r requirements.txt

      - name: Process
        run: python -u subscribe/process.py --overwrite

      - name: Timestamp
        run: date
